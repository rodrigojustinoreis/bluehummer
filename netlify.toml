[build]
  publish = "blue_hammer_remodeling_site"

# --- Canonical host: send the Netlify subdomains and www to the apex domain ---
[[redirects]]
  from = "https://bluehummer.netlify.app/*"
  to = "https://bluehammermd.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://main--bluehummer.netlify.app/*"
  to = "https://bluehammermd.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.bluehammermd.com/*"
  to = "https://bluehammermd.com/:splat"
  status = 301
  force = true

# --- Retired pages (logged in AGENT-LOG.md). Targets use the canonical extensionless URL form. ---
# Do NOT add name.html -> /name (or /index.html -> /) rules here without testing on a deploy preview first:
# Netlify resolves /name from name.html internally and such a forced rule can loop.
# (none at present: /silver-spring-md is a live page again since 2026-11-19, see AGENT-LOG.md)

# --- Internal files that must not be public on the hosted site ---
[[redirects]]
  from = "/README-START-HERE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/server.mjs"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/configure-domain.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/sitemap.template.xml"
  to = "/404.html"
  status = 404
  force = true

# --- Security + caching headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
